name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Offizielle aas-core-Testdaten holen
        run: pnpm test-data

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Plan Abschnitt 10: bricht ab, wenn das initiale Bundle 250 KB gzip reisst
      - name: Bundle-Budget
        run: pnpm budget
