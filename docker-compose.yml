services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3200
      DATA_DIR: /data
      AUTH_USERNAME: ${AUTH_USERNAME}
      AUTH_PASSWORD: ${AUTH_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-720}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
    volumes:
      # SQLite-Datei und Anhaenge, Backup ist ein Kopiervorgang dieses Volumes
      - aas-data:/data
    expose:
      - "3200"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3200/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      AAS_EDITOR_DOMAIN: ${AAS_EDITOR_DOMAIN:-:80}
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  aas-data:
  caddy-data:
  caddy-config:
