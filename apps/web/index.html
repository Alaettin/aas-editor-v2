<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AXON Editor</title>
    <script>
      /*
        Dichte und Sprache vor dem ersten Bild setzen.

        Ohne diese Zeilen laeuft erst React an, und der Nutzer sieht die Dichte bei jedem
        Laden kurz springen. Der Schluessel und die Vorgaben stehen ebenso in
        `store/ansicht.ts`; das ist die eine bewusste Wiederholung, denn hier darf noch
        kein Modul geladen sein.

        Die Klasse `dark` steht bedingungslos: es gibt nur eine Erscheinung. Sie bleibt
        allein wegen der `dark:`-Utilities im shadcn-Fremdcode, siehe tokens.css.
      */
      document.documentElement.classList.add("dark");
      (function () {
        try {
          var roh = localStorage.getItem("aas-editor-ansicht");
          var wert = roh ? JSON.parse(roh) : null;
          document.documentElement.dataset.density =
            wert && wert.density === "compact" ? "compact" : "cozy";
          var sprache =
            wert && (wert.language === "de" || wert.language === "en")
              ? wert.language
              : navigator.language.toLowerCase().indexOf("en") === 0
                ? "en"
                : "de";
          document.documentElement.lang = sprache;
        } catch (e) {
          /* Ein gesperrter Speicher darf das Laden nicht aufhalten. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
